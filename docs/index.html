<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 자동차 추천</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f3f6fb;
text-align:center;
padding:30px;
}

.box{
max-width:600px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px #ccc;
}

h1{
color:#2563eb;
}

.car{
font-size:80px;
}


input{
width:90%;
padding:14px;
margin:10px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}


button{
background:#2563eb;
color:white;
border:none;
padding:15px 30px;
border-radius:10px;
font-size:17px;
cursor:pointer;
}


.result{
margin-top:25px;
background:#eef2ff;
padding:20px;
border-radius:15px;
}


.qr{
width:220px;
margin-top:20px;
}


</style>

</head>


<body>


<div class="box">


<div class="car">🚗</div>


<h1>🤖 AI 자동차 추천</h1>

<p>
나의 조건을 입력하면 AI가 맞춤 자동차를 추천합니다.
</p>



<h3>💰 예산</h3>

<input id="budget"
placeholder="예: 4000만원">



<h3>🚘 차량 용도</h3>

<input id="purpose"
placeholder="예: 출퇴근, 가족용, 여행">



<h3>⭐ 선호 차량</h3>

<input id="style"
placeholder="예: SUV, 세단, 전기차, 스포츠카">



<button onclick="recommend()">
AI 자동차 추천
</button>



<div class="result" id="result">

추천 결과가 여기에 표시됩니다.

</div>



<h2>📱 홈페이지 QR</h2>

<img class="qr" src="./qr.png">


</div>



<script>


function recommend(){


let budget =
document.getElementById("budget").value;


let purpose =
document.getElementById("purpose").value;


let style =
document.getElementById("style").value;



let car="";



if(style.includes("SUV")){

car="🚙 현대 투싼 / 기아 쏘렌토";

}

else if(style.includes("세단")){

car="🚗 현대 그랜저 / 기아 K8";

}

else if(style.includes("전기차")){

car="⚡ 현대 아이오닉5 / 기아 EV6";

}

else if(style.includes("스포츠카")){

car="🏎️ 제네시스 쿠페 / 스포츠 모델";

}

else{

car="🚘 현대 싼타페 / 기아 K5";

}



document.getElementById("result").innerHTML=`

<h3>AI 추천 결과</h3>

예산 : ${budget}<br>

용도 : ${purpose}<br>

선호 차량 : ${style}

<br><br>

추천 차량:

<h2>${car}</h2>

조건에 맞는 차량을 추천했습니다.

`;

}


</script>


</body>
</html>
